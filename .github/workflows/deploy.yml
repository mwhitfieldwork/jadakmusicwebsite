name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --base-href="/jadakmusicwebsite/"

      - name: Add 404.html for client-side routing
        # GitHub Pages has no server, so it can't hand off a direct link like
        # /jadakmusicwebsite/piano to the Angular router — it just 404s. GitHub
        # Pages falls back to 404.html for any unmatched path, so serving a
        # copy of index.html there lets Angular's router take over and render
        # the right page. Copied post-build so it always matches the current
        # build's hashed script/style filenames.
        run: cp dist/jadak-music/index.html dist/jadak-music/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/jadak-music/
