<section class="page-hero">
  <div class="container">
    <span class="eyebrow eyebrow--on-dark">Music Production</span>
    <h1>Music Production</h1>
  </div>
</section>

<section class="section section--cream">
  <div class="container">
    <blockquote class="pull-quote">{{ content.quote }}</blockquote>
    <p>{{ content.intro }}</p>

    <h2 class="section-heading">Services I Provide</h2>
    <div class="grid grid--3 service-cards">
      <div class="card" *ngFor="let service of content.services">
        <h3>{{ service.title }}</h3>
        <p>{{ service.description }}</p>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section-heading">Listen</h2>
    <div class="media-grid">
      <app-media-placeholder *ngFor="let track of content.tracks" [title]="track.title + ' — ' + track.artist"></app-media-placeholder>
    </div>
  </div>
</section>

<section class="section section--cream text-center">
  <div class="container">
    <h2>Contact for booking info</h2>
    <a routerLink="/contact" class="btn btn--gold">Contact Jada</a>
  </div>
</section>
